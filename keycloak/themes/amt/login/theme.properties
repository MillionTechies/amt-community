# A Million Techies login theme. Extends Keycloak's own login theme, so every page
# (sign in, sign up, password reset, email verification, errors) keeps working;
# this theme only replaces the page layout, colours, type and wording.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's stylesheet first, then ours on top of it.
styles=css/styles.css css/amt.css

# The Community app is light only; keep sign-in consistent with it.
darkMode=false
