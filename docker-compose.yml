# Local development services. The Django API and the Vite frontend run on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
    ports:
      - "5433:5432" # 5433 on the host, so it does not clash with a local PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./scripts:/scripts:ro
      - ./keycloak/themes/amt:/opt/keycloak/themes/amt:ro # login theme; start-dev reloads edits

  # Catches every email the API sends in development. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox

volumes:
  db-data:
  keycloak-data:
