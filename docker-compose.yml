# Local development services. The Django API and the Vite frontend run on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
    ports:
      - "5433:5432" # 5433 on the host, so it does not clash with a local PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community"]
      interval: 5s
      retries: 10

  # The same image as auth.amilliontechies.com: Keycloak with the `amt` login theme and
  # the realm scripts (/opt/keycloak/amt-scripts). Built in MillionTechies/amt_auth.
  keycloak:
    image: ghcr.io/milliontechies/amt-keycloak:26.8.2-1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file # the image is built for PostgreSQL; dev mode keeps Keycloak's own file database
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./scripts:/scripts:ro
      # Editing the login theme? Mount amt_auth's copy over the built-in one; start-dev
      # reloads edits on the next page load:
      # - ../Authentication/deploy/keycloak/themes/amt:/opt/keycloak/themes/amt:ro

  # Catches every email the API sends in development. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox

volumes:
  db-data:
  keycloak-data:
