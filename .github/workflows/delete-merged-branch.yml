# Deletes a pull request's branch once it is merged, so old branches do not pile up.
# main, develop and release/* branches are kept.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != 'main'
      && github.head_ref != 'develop'
      && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete ${{ github.head_ref }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
