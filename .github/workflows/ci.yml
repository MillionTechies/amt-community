# Runs on every pull request into develop or main, and on every push to them.
# Both suites must keep 100% coverage; a pull request into main must come from a
# release/* branch.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only release branches merge into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = main ] && [[ "$HEAD" != release/* ]]; then
            echo "::error::Only release/* branches merge into main. Open this pull request against develop."
            exit 1
          fi
          echo "$HEAD -> $BASE is allowed."

  backend:
    name: Backend tests (100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: community
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U community"
          --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend lint, build and tests (100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
